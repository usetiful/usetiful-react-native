name: Publish to NPM

on:
  push:
    branches:
      - main

permissions:
  contents: write  # Needed for pushing commits & tags
  packages: write  # Needed if using GitHub Packages

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensures full git history

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run `release-it` to bump version and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}  # Auth for npm
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Default GitHub token
        run: npx release-it patch --ci --no-git.requireCleanWorkingDir

      - name: Commit and push version bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add package.json package-lock.json yarn.lock || true
          git commit -m "chore: release version bump [skip ci]" || true
          git push origin main || true